<div class="container">

  <h1>Faça seu login!</h1>

  <div class="form">
    <label>Usuário</label>
    <input [(ngModel)]="nome" type="text" placeholder="Digite deu usuário" />

    <label for="">Senha</label>
    <input [(ngModel)]="senha" type="text" placeholder="Digite sua senha..." />

    <button (click)="logar()">Acessar</button>
  </div>
</div>
